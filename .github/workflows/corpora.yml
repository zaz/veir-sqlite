name: corpora

on:
  schedule:
    # Poll every five minutes, offset by two minutes from leadership.
    - cron: "2-59/5 * * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: rescore even if VeIR main has not moved
        type: boolean
        default: false

permissions:
  contents: write

# Different trackers and VeIR revisions may score concurrently. Duplicate polls
# wait for the same revision's job, then check fresh reports before building.
# publish-reports.py still handles concurrent publication with normal pushes.

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      sha: ${{ steps.veir.outputs.sha }}
    steps:
      - name: Choose VeIR revision
        id: veir
        env:
          VEIR_REPOSITORY: https://github.com/opencompl/veir.git
        run: |
          sha=$(git ls-remote "$VEIR_REPOSITORY" refs/heads/main | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  score:
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: tracker-${{ github.workflow }}-${{ github.ref }}-${{ needs.revision.outputs.sha }}
      cancel-in-progress: false
      # A later poll must not cancel a pending push/PR check or forced rescore.
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          path: veir-sqlite
          # Resolve main after acquiring the lock, so a waiting poll sees the
          # previous job's published reports rather than its event's old commit.
          # PRs and non-main runs retain checkout's default event revision.
          ref: ${{ github.ref == 'refs/heads/main' && github.ref || '' }}

      - name: Validate tracking inputs
        working-directory: veir-sqlite
        run: |
          python3 vectors/update.py --check
          python3 llvm/update.py --check
          python3 llvm/update.py --check --vectorized
          python3 -m unittest discover -s tests

      - name: Has VeIR moved?
        id: veir
        working-directory: veir-sqlite
        env:
          VEIR_REPOSITORY: https://github.com/opencompl/veir.git
          PLANNED_VEIR_SHA: ${{ needs.revision.outputs.sha }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          FORCE: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.force == true }}
        run: |
          sha=$PLANNED_VEIR_SHA
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$SCHEDULED" = true ]; then
            latest=$(git ls-remote "$VEIR_REPOSITORY" refs/heads/main | cut -f1)
            [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
            if [ "$sha" != "$latest" ]; then
              echo "VeIR advanced while this poll waited; a fresh poll will score it."
              echo "stale=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          vectors=$(grep '^| veir |' VECTORS.md | grep -oE '[0-9a-f]{40}' | head -1 || true)
          llvm=$(grep '^| veir |' LLVM.md | grep -oE '[0-9a-f]{40}' | head -1 || true)
          llvm_vectorized=$(grep '^| veir |' LLVM_VECTORIZED.md | grep -oE '[0-9a-f]{40}' | head -1 || true)
          if [ "$sha" = "$vectors" ] && [ "$sha" = "$llvm" ] && [ "$sha" = "$llvm_vectorized" ] && [ "$FORCE" != true ]; then
            echo "Reports already cover this VeIR revision; nothing to do."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.veir.outputs.stale == 'true'
        with:
          repository: opencompl/veir
          ref: ${{ steps.veir.outputs.sha }}
          path: veir

      - name: Build veir-opt
        if: steps.veir.outputs.stale == 'true'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: veir
          build-args: "veir-opt"
          test: false

      - name: Score vector and LLVM corpora
        id: score
        if: steps.veir.outputs.stale == 'true'
        working-directory: veir-sqlite
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python3 vectors/score.py --veir ../veir --json-out "$RUNNER_TEMP/vector-results.json" \
            --out "$RUNNER_TEMP/reports/VECTORS.md"
          python3 llvm/score.py --veir ../veir --json-out "$RUNNER_TEMP/llvm-results.json" \
            --out "$RUNNER_TEMP/reports/LLVM.md"
          python3 llvm/score.py --vectorized --veir ../veir --json-out "$RUNNER_TEMP/llvm-vectorized-results.json" \
            --out "$RUNNER_TEMP/reports/LLVM_VECTORIZED.md"
          cat "$RUNNER_TEMP/reports/"*.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.score.outcome == 'success' || steps.score.outcome == 'failure') }}
        with:
          name: corpus-results
          path: |
            ${{ runner.temp }}/vector-results.json
            ${{ runner.temp }}/llvm-results.json
            ${{ runner.temp }}/llvm-vectorized-results.json
            ${{ runner.temp }}/reports/*.md

      - name: Publish reports
        if: steps.score.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: veir-sqlite
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 publish-reports.py corpora --veir ../veir \
            --reports-dir "$RUNNER_TEMP/reports" --run-url "$RUN_URL"
